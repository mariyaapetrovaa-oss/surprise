<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>important question</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      background: #111;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }


    /* =========================================
       ALL SCREENS
       ========================================= */

    .screen {
      position: fixed;
      inset: 0;

      display: none;
      justify-content: center;
      align-items: center;

      overflow: hidden;
    }

    .screen.active {
      display: flex;
    }


    /* =========================================
       PAGE 1
       ========================================= */

    #page1 {
      background: #111;
    }

    .invite {
      position: relative;

      width: min(95vw, calc(92vh * 1.5));
      aspect-ratio: 3 / 2;

      overflow: hidden;
    }

    .background {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      object-fit: contain;

      display: block;

      z-index: 1;

      pointer-events: none;
    }


    /* =========================================
       PAGE 1 CLICK AREAS
       ========================================= */

    .click-zone {
      position: absolute;

      z-index: 9999;

      padding: 0;
      margin: 0;

      border: none;
      background: transparent;

      cursor: pointer;
      pointer-events: auto;

      color: transparent;
      font-size: 0;
    }


    #yes-main {
      left: 5%;
      top: 69%;

      width: 22%;
      height: 15%;
    }


    #no-main {
      left: 27%;
      top: 71%;

      width: 15%;
      height: 13%;
    }



    /* =========================================
       CONFETTI
       ========================================= */

    .confetti-piece {
      position: absolute;

      top: -8%;

      z-index: 500;

      pointer-events: none;

      animation-name: confettiFall;
      animation-timing-function: linear;
      animation-fill-mode: forwards;
    }


    @keyframes confettiFall {

      0% {
        transform:
          translateY(-30px)
          translateX(0)
          rotate(0deg);

        opacity: 1;
      }

      20% {
        transform:
          translateY(20vh)
          translateX(18px)
          rotate(140deg);
      }

      40% {
        transform:
          translateY(40vh)
          translateX(-14px)
          rotate(300deg);
      }

      60% {
        transform:
          translateY(60vh)
          translateX(20px)
          rotate(450deg);
      }

      80% {
        transform:
          translateY(80vh)
          translateX(-12px)
          rotate(600deg);
      }

      100% {
        transform:
          translateY(110vh)
          translateX(10px)
          rotate(760deg);

        opacity: 0.8;
      }

    }



    /* =========================================
       PAGE 2 — HAMSTER
       ========================================= */

    #page2 {
      background: #000;
    }


    .threat-container {
      position: relative;

      width: 100%;
      height: 100%;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
    }


    .threat-video {
      position: absolute;

      width: 100%;
      height: 100%;

      object-fit: contain;

      background: #000;

      z-index: 1;
    }


    .threat-title {
      position: absolute;

      top: 5%;
      left: 50%;

      transform: translateX(-50%);

      z-index: 20;

      margin: 0;
      padding: 15px 30px;

      background: #ef7eae;
      color: white;

      font-size: clamp(38px, 6vw, 90px);
      font-weight: 900;

      text-align: center;
      white-space: nowrap;
      line-height: 1;

      box-shadow: 8px 8px 0 white;
    }


    /*
       YES BUTTON

       Moved right down to the bottom
       so it doesn't cover the hamster.
    */

    #yes-threat {
      position: absolute;

      left: 50%;
      bottom: 3%;

      transform: translateX(-50%);

      z-index: 9999;

      border: 7px solid #ef7eae;

      background: white;
      color: #ef7eae;

      padding: 12px 45px;

      font-size: clamp(28px, 4vw, 55px);

      font-weight: 900;

      cursor: pointer;

      box-shadow: 8px 8px 0 #ef7eae;

      transition: transform 0.15s ease;
    }


    #yes-threat:hover {
      transform:
        translateX(-50%)
        scale(1.1);
    }



    /* =========================================
       PAGE 3 — HAPPY CAT
       ========================================= */

    #page3 {
      background: #ef7eae;
    }


    .celebration-container {
      position: relative;

      width: 100%;
      height: 100%;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
    }


    .happy-video {
      position: absolute;

      width: 100%;
      height: 100%;

      object-fit: contain;

      background: #ef7eae;

      z-index: 1;
    }


    /* =========================================
       HAPPY CAT TEXT
       ========================================= */

    .celebration-title {
      position: absolute;

      top: 4%;
      left: 50%;

      transform: translateX(-50%);

      z-index: 1000;

      margin: 0;

      width: 95%;

      color: white;

      font-size: clamp(36px, 6vw, 90px);

      font-weight: 900;
      line-height: 0.95;

      text-align: center;

      text-shadow:
        5px 5px 0 #ef7eae,
        -3px -3px 0 #ef7eae,
        3px -3px 0 #ef7eae,
        -3px 3px 0 #ef7eae;
    }


    .celebration-title span {
      display: block;
    }


    /*
       BEER EMOJI

       Separate from the title now,
       so it won't sit on the cat's head.
    */

    .celebration-beer {
      position: absolute;

      right: 8%;
      bottom: 8%;

      z-index: 1000;

      font-size: clamp(55px, 8vw, 120px);

      transform: rotate(12deg);

      pointer-events: none;
    }



    /* =========================================
       MOBILE
       ========================================= */

    @media (max-width: 600px) {

      .invite {
        width: min(
          98vw,
          calc(95vh * 1.5)
        );
      }


      .threat-title {
        top: 4%;

        width: 90%;

        white-space: normal;

        font-size: 11vw;

        padding: 12px;
      }


      #yes-threat {
        bottom: 3%;

        font-size: 9vw;

        padding: 10px 30px;
      }


      .celebration-title {
        top: 5%;

        font-size: 10vw;
      }


      .celebration-beer {
        right: 5%;
        bottom: 5%;

        font-size: 18vw;
      }

    }


  </style>

</head>



<body>


  <!-- =====================================
       PAGE 1
       ===================================== -->

  <section
    id="page1"
    class="screen active"
  >


    <div class="invite">


      <img
        src="page1.png"
        class="background"
        alt="Pub invitation"
      >


      <button
        type="button"
        id="yes-main"
        class="click-zone"
        aria-label="Yes"
      >
        YES
      </button>


      <button
        type="button"
        id="no-main"
        class="click-zone"
        aria-label="No"
      >
        NO
      </button>


    </div>


  </section>



  <!-- =====================================
       PAGE 2 — HAMSTER
       ===================================== -->

  <section
    id="page2"
    class="screen"
  >


    <div class="threat-container">


      <video
        id="hamster-video"
        class="threat-video"
        src="hamster.mov"
        playsinline
        loop
      ></video>


      <h1 class="threat-title">
        PUB ON THURSDAY?
      </h1>


      <!-- ONLY OPTION -->

      <button
        type="button"
        id="yes-threat"
      >
        YES!!!
      </button>


    </div>


  </section>



  <!-- =====================================
       PAGE 3 — HAPPY CAT
       ===================================== -->

  <section
    id="page3"
    class="screen"
  >


    <div class="celebration-container">


      <video
        id="happy-video"
        class="happy-video"
        src="happycat.mov"
        playsinline
        loop
      ></video>


      <h1 class="celebration-title">

        <span>
          YAYYYYY
        </span>

        <span>
          SEE YOU ON THURSDAY!!!
        </span>

      </h1>


      <!-- Beer moved away from cat -->

      <div class="celebration-beer">
        🍻
      </div>


    </div>


  </section>



  <script>


    /* =====================================
       ELEMENTS
       ===================================== */


    const page1 =
      document.getElementById("page1");

    const page2 =
      document.getElementById("page2");

    const page3 =
      document.getElementById("page3");


    const yesMain =
      document.getElementById("yes-main");

    const noMain =
      document.getElementById("no-main");

    const yesThreat =
      document.getElementById("yes-threat");


    const hamsterVideo =
      document.getElementById("hamster-video");

    const happyVideo =
      document.getElementById("happy-video");



    /* =====================================
       LOWER HAPPY CAT VOLUME
       ===================================== */

    happyVideo.volume = 0.35;



    /* =====================================
       CONFETTI
       ===================================== */


    const confettiColours = [
      "#ff1493",
      "#ff4500",
      "#ffd700",
      "#00c853",
      "#00bfff",
      "#8a2be2",
      "#ff69b4"
    ];



    function createConfetti(
      container,
      celebration = false
    ) {


      const piece =
        document.createElement("div");


      piece.classList.add(
        "confetti-piece"
      );


      piece.style.left =
        Math.random() * 100 + "%";


      piece.style.backgroundColor =
        confettiColours[
          Math.floor(
            Math.random() *
            confettiColours.length
          )
        ];


      const size =
        celebration
          ? Math.random() * 11 + 6
          : Math.random() * 8 + 5;


      piece.style.width =
        size + "px";


      piece.style.height =
        size * 1.7 + "px";


      const duration =
        celebration
          ? Math.random() * 2 + 2.5
          : Math.random() * 3 + 3.5;


      piece.style.animationDuration =
        duration + "s";


      if (Math.random() > 0.8) {

        piece.style.borderRadius =
          "50%";

      } else {

        piece.style.borderRadius =
          "2px";

      }


      container.appendChild(piece);


      setTimeout(
        function () {

          piece.remove();

        },
        7000
      );


    }



    /* =====================================
       PAGE 1 CONFETTI
       ===================================== */


    setInterval(
      function () {

        if (
          page1.classList.contains("active")
        ) {

          createConfetti(
            page1,
            false
          );

        }

      },
      100
    );


    for (
      let i = 0;
      i < 40;
      i++
    ) {

      setTimeout(
        function () {

          createConfetti(
            page1,
            false
          );

        },
        Math.random() * 1200
      );

    }



    /* =====================================
       HAMSTER SCREEN
       ===================================== */


    function showHamster() {


      page1.classList.remove(
        "active"
      );

      page3.classList.remove(
        "active"
      );

      page2.classList.add(
        "active"
      );


      hamsterVideo.currentTime = 0;

      hamsterVideo.muted = false;


      hamsterVideo.play().catch(
        function () {

          hamsterVideo.muted = true;

          hamsterVideo.play();

        }
      );


    }



    /* =====================================
       CELEBRATION SCREEN
       ===================================== */


    function showCelebration() {


      page1.classList.remove(
        "active"
      );

      page2.classList.remove(
        "active"
      );

      page3.classList.add(
        "active"
      );


      hamsterVideo.pause();


      happyVideo.currentTime = 0;

      happyVideo.muted = false;


      /*
         35% volume
      */

      happyVideo.volume = 0.35;


      happyVideo.play().catch(
        function () {

          happyVideo.muted = true;

          happyVideo.play();

        }
      );



      /* BIG CONFETTI BURST */

      for (
        let i = 0;
        i < 120;
        i++
      ) {

        setTimeout(
          function () {

            createConfetti(
              page3,
              true
            );

          },
          Math.random() * 1500
        );

      }


    }



    /* =====================================
       CONTINUOUS CELEBRATION CONFETTI
       ===================================== */


    setInterval(
      function () {

        if (
          page3.classList.contains(
            "active"
          )
        ) {

          createConfetti(
            page3,
            true
          );

        }

      },
      55
    );



    /* =====================================
       BUTTON ROUTES
       ===================================== */


    yesMain.addEventListener(
      "click",
      function () {

        showCelebration();

      }
    );


    noMain.addEventListener(
      "click",
      function () {

        showHamster();

      }
    );


    yesThreat.addEventListener(
      "click",
      function () {

        showCelebration();

      }
    );


  </script>


</body>

</html>
