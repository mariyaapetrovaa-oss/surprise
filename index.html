<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>important question</title>


  <style>

    /* ==============================
       BASIC PAGE SETUP
       ============================== */

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }


    body {

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;

      background: #111;

      font-family: Arial, Helvetica, sans-serif;

    }



    /* ==============================
       INVITATION CONTAINER
       ============================== */

    .invite {

      position: relative;

      /*
        Your image is approximately 3:2.

        These two calculations make sure
        the invitation fits BOTH the width
        and height of the visitor's screen.
      */

      width: min(95vw, calc(92vh * 1.5));

      aspect-ratio: 3 / 2;

      overflow: hidden;

    }



    /* ==============================
       YOUR COMPLETE PAGE 1 IMAGE
       ============================== */

    .background {

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      object-fit: contain;

      display: block;

      z-index: 1;

    }



    /* ==============================
       INVISIBLE CLICKABLE BUTTONS

       These sit over the buttons that
       already exist inside page1.png.
       ============================== */

    .click-zone {

      position: absolute;

      z-index: 20;

      background: transparent;

      border: none;

      padding: 0;

      font-size: 0;

      cursor: pointer;

    }



    /* YES!!! */

    #yes {

      left: 5.5%;
      top: 81%;

      width: 20%;
      height: 13%;

    }



    /* No :( */

    #no {

      left: 27%;
      top: 83%;

      width: 13%;
      height: 11%;

    }



    /* ==============================
       FALLING CONFETTI
       ============================== */

    .confetti-piece {

      position: absolute;

      top: -5%;

      z-index: 10;

      pointer-events: none;

      animation-name: confettiFall;
      animation-timing-function: linear;
      animation-fill-mode: forwards;

    }



    @keyframes confettiFall {

      0% {

        transform:
          translateY(-20px)
          translateX(0)
          rotate(0deg);

        opacity: 1;

      }


      25% {

        transform:
          translateY(25vh)
          translateX(15px)
          rotate(180deg);

      }


      50% {

        transform:
          translateY(50vh)
          translateX(-10px)
          rotate(360deg);

      }


      75% {

        transform:
          translateY(75vh)
          translateX(12px)
          rotate(540deg);

      }


      100% {

        transform:
          translateY(110vh)
          translateX(-5px)
          rotate(720deg);

        opacity: 0.7;

      }

    }



    /* ==============================
       SMALL SCREEN ADJUSTMENTS
       ============================== */

    @media (max-width: 600px) {

      .invite {

        width: min(98vw, calc(95vh * 1.5));

      }

    }



  </style>

</head>



<body>


  <!-- ==============================
       INVITATION
       ============================== -->

  <main class="invite">


    <!-- YOUR COMPLETE DESIGN -->

    <img
      src="page1.png"
      class="background"
      alt="Pub invitation"
    >



    <!--
      Invisible YES button.

      The visible YES!!! is already
      contained in page1.png.
    -->

    <button
      id="yes"
      class="click-zone"
      aria-label="Yes"
    >
      YES
    </button>



    <!--
      Invisible NO button.

      The visible No :( is already
      contained in page1.png.
    -->

    <button
      id="no"
      class="click-zone"
      aria-label="No"
    >
      NO
    </button>


  </main>



  <script>


    /* ==============================
       CONFETTI
       ============================== */


    const invite =
      document.querySelector(".invite");


    const confettiColours = [

      "#ff1493",  // pink
      "#ff4500",  // orange
      "#ffd700",  // yellow
      "#00c853",  // green
      "#00bfff",  // blue
      "#8a2be2",  // purple
      "#ff69b4"   // light pink

    ];



    function createConfetti() {


      const piece =
        document.createElement("div");


      piece.classList.add(
        "confetti-piece"
      );



      /* RANDOM POSITION */

      piece.style.left =
        Math.random() * 100 + "%";



      /* RANDOM COLOUR */

      piece.style.backgroundColor =

        confettiColours[

          Math.floor(
            Math.random() *
            confettiColours.length
          )

        ];



      /* RANDOM SIZE */

      const size =
        Math.random() * 6 + 5;


      piece.style.width =
        size + "px";


      piece.style.height =
        size * 1.7 + "px";



      /* RANDOM FALLING SPEED */

      const duration =
        Math.random() * 3 + 4;


      piece.style.animationDuration =
        duration + "s";



      /* RANDOM SHAPE */

      if (Math.random() > 0.75) {

        piece.style.borderRadius =
          "50%";

      }

      else {

        piece.style.borderRadius =
          "2px";

      }



      /* RANDOM STARTING ROTATION */

      piece.style.rotate =
        Math.random() * 180 + "deg";



      invite.appendChild(piece);



      /* CLEAN UP AFTER IT FALLS */

      setTimeout(

        function () {

          piece.remove();

        },

        8000

      );


    }



    /*
      Gentle continuous confetti.

      One new piece approximately
      every 350 milliseconds.
    */

    setInterval(
      createConfetti,
      350
    );





    /* ==============================
       YES BUTTON
       ============================== */


    document
      .getElementById("yes")
      .addEventListener(
        "click",
        function () {

          /*
            TEMPORARY.

            Next we'll replace this
            with the happy cat screen.
          */

          alert(
            "CORRECT ANSWER 🎉"
          );

        }
      );





    /* ==============================
       NO BUTTON
       ============================== */


    document
      .getElementById("no")
      .addEventListener(
        "click",
        function () {

          /*
            TEMPORARY.

            Next we'll replace this
            with the threatening
            hamster screen.
          */

          alert(
            "wrong answer."
          );

        }
      );


  </script>


</body>

</html>
