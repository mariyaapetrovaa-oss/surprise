<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>important question</title>

  <style>

    /* =========================
       BASIC PAGE
       ========================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;

      background: #111;

      font-family: Arial, Helvetica, sans-serif;
    }


    /* =========================
       INVITATION
       ========================= */

    .invite {
      position: relative;

      width: min(95vw, calc(92vh * 1.5));

      aspect-ratio: 3 / 2;

      overflow: hidden;
    }


    /* =========================
       YOUR PAGE1.PNG
       ========================= */

    .background {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      object-fit: contain;

      display: block;

      z-index: 1;

      /* Image cannot block button clicks */
      pointer-events: none;
    }


    /* =========================
       CLICKABLE AREAS
       ========================= */

    .click-zone {
      position: absolute;

      z-index: 9999;

      padding: 0;
      margin: 0;

      border: none;

      cursor: pointer;

      pointer-events: auto;

      /* Hide actual button text */
      color: transparent;
      font-size: 0;
    }


    /* =========================
       YES CLICK AREA
       ========================= */

    #yes {
      left: 5%;
      top: 69%;

      width: 22%;
      height: 15%;

      /*
        TEMPORARILY RED
        so we can see the click area.
      */

      background:
        rgba(255, 0, 0, 0.40);
    }


    /* =========================
       NO CLICK AREA
       ========================= */

    #no {
      left: 27%;
      top: 71%;

      width: 15%;
      height: 13%;

      /*
        TEMPORARILY BLUE
        so we can see the click area.
      */

      background:
        rgba(0, 0, 255, 0.40);
    }


    /* =========================
       FALLING CONFETTI
       ========================= */

    .confetti-piece {
      position: absolute;

      top: -8%;

      z-index: 50;

      pointer-events: none;

      animation-name: confettiFall;
      animation-timing-function: linear;
      animation-fill-mode: forwards;
    }


    @keyframes confettiFall {

      0% {
        transform:
          translateY(-30px)
          translateX(0)
          rotate(0deg);

        opacity: 1;
      }

      20% {
        transform:
          translateY(20vh)
          translateX(18px)
          rotate(140deg);
      }

      40% {
        transform:
          translateY(40vh)
          translateX(-14px)
          rotate(300deg);
      }

      60% {
        transform:
          translateY(60vh)
          translateX(20px)
          rotate(450deg);
      }

      80% {
        transform:
          translateY(80vh)
          translateX(-12px)
          rotate(600deg);
      }

      100% {
        transform:
          translateY(110vh)
          translateX(10px)
          rotate(760deg);

        opacity: 0.8;
      }

    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

      .invite {
        width: min(
          98vw,
          calc(95vh * 1.5)
        );
      }

    }

  </style>

</head>


<body>


  <main class="invite">


    <!-- YOUR COMPLETE DESIGN -->

    <img
      src="page1.png"
      class="background"
      alt="Pub invitation"
    >


    <!-- YES CLICK ZONE -->

    <button
      type="button"
      id="yes"
      class="click-zone"
      aria-label="Yes"
    >
      YES
    </button>


    <!-- NO CLICK ZONE -->

    <button
      type="button"
      id="no"
      class="click-zone"
      aria-label="No"
    >
      NO
    </button>


  </main>


  <script>


    /* =========================
       CONFETTI
       ========================= */

    const invite =
      document.querySelector(".invite");


    const confettiColours = [
      "#ff1493",
      "#ff4500",
      "#ffd700",
      "#00c853",
      "#00bfff",
      "#8a2be2",
      "#ff69b4"
    ];


    function createConfetti() {

      const piece =
        document.createElement("div");

      piece.classList.add(
        "confetti-piece"
      );


      /* RANDOM POSITION */

      piece.style.left =
        Math.random() * 100 + "%";


      /* RANDOM COLOUR */

      piece.style.backgroundColor =
        confettiColours[
          Math.floor(
            Math.random() *
            confettiColours.length
          )
        ];


      /* RANDOM SIZE */

      const size =
        Math.random() * 8 + 5;

      piece.style.width =
        size + "px";

      piece.style.height =
        (size * 1.7) + "px";


      /* RANDOM SPEED */

      const duration =
        Math.random() * 3 + 3.5;

      piece.style.animationDuration =
        duration + "s";


      /* RANDOM SHAPE */

      if (Math.random() > 0.8) {

        piece.style.borderRadius =
          "50%";

      } else {

        piece.style.borderRadius =
          "2px";

      }


      invite.appendChild(piece);


      /* REMOVE AFTER FALLING */

      setTimeout(
        function () {
          piece.remove();
        },
        7000
      );

    }


    /*
       Lots of continuous confetti
    */

    setInterval(
      createConfetti,
      100
    );


    /*
       Initial burst when page opens
    */

    for (let i = 0; i < 40; i++) {

      setTimeout(
        createConfetti,
        Math.random() * 1200
      );

    }



    /* =========================
       YES BUTTON TEST
       ========================= */

    const yesButton =
      document.getElementById("yes");


    yesButton.addEventListener(
      "click",
      function () {

        alert(
          "CORRECT ANSWER 🎉"
        );

      }
    );



    /* =========================
       NO BUTTON TEST
       ========================= */

    const noButton =
      document.getElementById("no");


    noButton.addEventListener(
      "click",
      function () {

        alert(
          "wrong answer."
        );

      }
    );


  </script>


</body>

</html>
